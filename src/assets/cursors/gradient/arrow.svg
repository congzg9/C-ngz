<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 90" fill="none">
  <defs>
    <linearGradient id="grad" x1="5" y1="5" x2="75" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#f97316"/>
      <stop offset="30%"  stop-color="#ec4899"/>
      <stop offset="65%"  stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="5" y1="5" x2="38" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.55)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-15%" width="140%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="rgba(0,0,0,0.4)"/>
    </filter>
  </defs>
  <!-- Gradient body with shadow -->
  <path filter="url(#shadow)" d="M5 5L5 85L75 35Z" fill="url(#grad)"/>
  <!-- Sheen overlay -->
  <path d="M5 5L5 85L75 35Z" fill="url(#sheen)"/>
  <!-- Thin white outline -->
  <path d="M5 5L5 85L75 35Z" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
