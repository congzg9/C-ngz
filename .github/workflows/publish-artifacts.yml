name: Publish Staged Artifacts

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Workflow run ID to download artifacts from'
        required: true
        default: '38587395415'
      tag_name:
        description: 'Release tag to upload to'
        required: true
        default: 'v2.0.0'

permissions:
  contents: write

jobs:
  publish:
    name: Upload Artifacts to Release
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts from run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p downloaded
          gh run download "${{ github.event.inputs.run_id }}" --repo "${{ github.repository }}" --dir downloaded
          find downloaded -type f

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(
            downloaded/*/*.dmg
            downloaded/*/*.zip
            downloaded/*/*.blockmap
            downloaded/*/*.AppImage
            downloaded/*/latest-mac.yml
            downloaded/*/SHA256SUMS*.txt
          )
          echo "Uploading files: ${files[*]}"
          gh release upload "${{ github.event.inputs.tag_name }}" "${files[@]}" --repo "${{ github.repository }}" --clobber
