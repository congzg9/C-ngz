<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Record-AutoZoom • Pro 9:16 Video (Chuẩn Tiếng Việt • Không Quảng Cáo)</title>
  <!-- Nhúng font Be Vietnam Pro & Inter với đầy đủ bộ ký tự Tiếng Việt (Vietnamese Subsets) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;700;800;900&family=Inter:wght@700;800;900&display=swap&subset=vietnamese" rel="stylesheet">
  <style>
    :root {
      --bg: #030308;
      --primary: #f97316;
      --accent: #38bdf8;
      --font-main: 'Be Vietnam Pro', 'Segoe UI', -apple-system, Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      background: #030308;
      color: #fff;
      font-family: var(--font-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
    }

    /* CONTROLS HEADER */
    .controls-bar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      background: rgba(18, 18, 28, 0.85);
      backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 10px 24px;
      border-radius: 999px;
      margin-bottom: 16px;
      box-shadow: 0 16px 50px rgba(0,0,0,0.7), 0 0 20px rgba(249, 115, 22, 0.2);
      z-index: 100;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #f97316, #ea580c);
      color: #fff;
      font-family: var(--font-main);
      font-weight: 800;
      font-size: 14px;
      padding: 10px 22px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 4px 18px rgba(249, 115, 22, 0.5);
    }
    .btn:hover { transform: scale(1.05); filter: brightness(1.1); }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: none;
    }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.16); }

    .btn-export {
      background: linear-gradient(135deg, #06b6d4, #0284c7);
      box-shadow: 0 4px 18px rgba(2, 132, 199, 0.5);
    }

    .status-text {
      font-size: 13px;
      color: #38bdf8;
      font-family: var(--font-main);
      font-weight: 800;
      min-width: 95px;
      text-align: center;
    }

    .badge-tag {
      font-size: 11px;
      background: rgba(249, 115, 22, 0.15);
      border: 1px solid #f97316;
      color: #fdba74;
      padding: 4px 14px;
      border-radius: 999px;
      font-weight: 800;
    }

    /* 9:16 PREVIEW FRAME */
    .phone-container {
      position: relative;
      width: 405px;
      height: 720px;
      border-radius: 38px;
      overflow: hidden;
      box-shadow: 
        0 30px 90px -15px rgba(249, 115, 22, 0.4),
        0 0 0 10px rgba(255, 255, 255, 0.08),
        0 0 0 1px rgba(255, 255, 255, 0.15);
      background: #000;
      cursor: pointer;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .audio-tip {
      margin-top: 10px;
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- CONTROLS -->
  <div class="controls-bar">
    <button class="btn" id="btnPlay" onclick="togglePlay()">
      <span id="playIcon">▶</span> <span id="playText">Phát Video (Có Voice AI + Beat)</span>
    </button>
    <button class="btn btn-export" id="btnRecord" onclick="recordAndExport()">
      <span>⚡</span> <span>Xuất File 60 FPS (Đủ Hình & Tiếng)</span>
    </button>
    <button class="btn btn-secondary" onclick="restartVideo()">
      <span>🔄</span> <span>Xem lại</span>
    </button>
    <div class="status-text" id="timeDisplay">00:00 / 00:14</div>
    <div class="badge-tag">✨ BE VIETNAM PRO • CHUẨN ĐỒ HỌA SANG TRỌNG</div>
  </div>

  <!-- 9:16 CANVAS (1080 x 1920) -->
  <div class="phone-container" onclick="togglePlay()">
    <canvas id="videoCanvas" width="1080" height="1920"></canvas>
  </div>

  <div class="audio-tip">💡 Nhấn vào màn hình hoặc nút "Phát Video" để nghe trọn vẹn giọng đọc AI & nhạc beat!</div>

  <script>
    const canvas = document.getElementById('videoCanvas');
    const ctx = canvas.getContext('2d');
    const W = 1080;
    const H = 1920;
    const TOTAL_DURATION = 13.8; // 13.8s: Vừa vặn trọn vẹn lời bình & outro tinh tế, không có quảng cáo
    const FONT_FAMILY = '"Be Vietnam Pro", "Segoe UI", -apple-system, sans-serif';

    let currentTime = 0;
    let isPlaying = false;
    let lastTimestamp = 0;

    // ─── LOAD TÀI NGUYÊN (RESOURCES) ──────────────────────────────────────
    const logoImg = new Image();
    logoImg.src = './app-icon.png';

    // Video quay màn hình thực tế (ok.mp4)
    const demoVideo = document.createElement('video');
    demoVideo.src = './demo-video.mp4';
    demoVideo.crossOrigin = 'anonymous';
    demoVideo.muted = true;
    demoVideo.playsInline = true;
    demoVideo.preload = 'auto';
    demoVideo.load();

    // Tệp giọng đọc AI tiếng Việt (vi-VN-NamMinhNeural)
    const voiceAudio = new Audio('./promo-voice.mp3');
    voiceAudio.preload = 'auto';

    // ─── KINETIC SUBTITLES (CHUẨN FONT TIẾNG VIỆT • KHÔNG QUẢNG CÁO) ──────
    const subtitles = [
      {
        start: 0.1, end: 3.35,
        words: [
          { text: "Bạn", start: 0.1, end: 0.4 },
          { text: "vẫn", start: 0.4, end: 0.7 },
          { text: "quay", start: 0.7, end: 1.0 },
          { text: "màn", start: 1.0, end: 1.2 },
          { text: "hình,", start: 1.2, end: 1.5 },
          { text: "mất", start: 1.5, end: 1.8 },
          { text: "hàng", start: 1.8, end: 2.1 },
          { text: "giờ", start: 2.1, end: 2.4 },
          { text: "ZOOM", start: 2.4, end: 2.85, highlight: "#ef4444" },
          { text: "THỦ CÔNG Ư?", start: 2.85, end: 3.35, highlight: "#ef4444" }
        ]
      },
      {
        start: 3.35, end: 7.68,
        words: [
          { text: "Record", start: 3.35, end: 3.8, highlight: "#38bdf8" },
          { text: "Auto", start: 3.8, end: 4.2, highlight: "#38bdf8" },
          { text: "Zoom", start: 4.2, end: 4.6, highlight: "#38bdf8" },
          { text: "tự", start: 4.6, end: 4.9 },
          { text: "động", start: 4.9, end: 5.2 },
          { text: "BẮT NÉT", start: 5.2, end: 5.8, highlight: "#facc15" },
          { text: "chuột,", start: 5.8, end: 6.2 },
          { text: "ZOOM", start: 6.2, end: 6.7, highlight: "#4ade80" },
          { text: "MƯỢT", start: 6.7, end: 7.1, highlight: "#4ade80" },
          { text: "ĐIỆN ẢNH!", start: 7.1, end: 7.68, highlight: "#facc15" }
        ]
      },
      {
        start: 7.68, end: 12.9,
        words: [
          { text: "TỰ ĐỘNG", start: 7.68, end: 8.4, highlight: "#f97316" },
          { text: "HOÀN TOÀN", start: 8.4, end: 9.1, highlight: "#f97316" },
          { text: "100%,", start: 9.1, end: 9.7, highlight: "#f97316" },
          { text: "khung", start: 9.7, end: 10.0 },
          { text: "hình", start: 10.0, end: 10.3 },
          { text: "60 FPS", start: 10.3, end: 11.1, highlight: "#38bdf8" },
          { text: "siêu", start: 11.1, end: 11.4 },
          { text: "mượt", start: 11.4, end: 11.8, highlight: "#4ade80" },
          { text: "trên cả", start: 11.8, end: 12.2 },
          { text: "MAC & WIN!", start: 12.2, end: 12.9, highlight: "#a855f7" }
        ]
      }
    ];

    // ─── AUDIO ENGINE & SYNTHESIZER BEAT ──────────────────────────────────
    let audioCtx = null;
    let audioDest = null;
    let voiceNode = null;
    let playedSFX = {};

    function initAudioEngine() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
        audioDest = audioCtx.createMediaStreamDestination();

        voiceNode = audioCtx.createMediaElementSource(voiceAudio);
        voiceNode.connect(audioCtx.destination);
        voiceNode.connect(audioDest);
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Nhịp gõ beat ngầm 125 BPM
    function playBeat(time) {
      if (!audioCtx) return;
      const bpm = 125;
      const beatInterval = 60 / bpm;
      const beatNum = Math.floor(time / beatInterval);
      const beatKey = 'beat_' + beatNum;

      if (!playedSFX[beatKey] && time < TOTAL_DURATION) {
        playedSFX[beatKey] = true;
        const now = audioCtx.currentTime;

        if (beatNum % 2 === 0) {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(115, now);
          osc.frequency.exponentialRampToValueAtTime(32, now + 0.12);
          gain.gain.setValueAtTime(0.32, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          gain.connect(audioDest);
          osc.start(now);
          osc.stop(now + 0.15);
        } else {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(240, now);
          osc.frequency.exponentialRampToValueAtTime(75, now + 0.08);
          gain.gain.setValueAtTime(0.16, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          gain.connect(audioDest);
          osc.start(now);
          osc.stop(now + 0.1);
        }
      }
    }

    function playSfxImpact() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.exponentialRampToValueAtTime(26, now + 0.35);
      gain.gain.setValueAtTime(0.5, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      gain.connect(audioDest);
      osc.start(now);
      osc.stop(now + 0.4);
    }

    function playSfxWhoosh() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(200, now);
      osc.frequency.exponentialRampToValueAtTime(800, now + 0.18);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      gain.connect(audioDest);
      osc.start(now);
      osc.stop(now + 0.22);
    }

    function checkSFX(t) {
      playBeat(t);
      if (t >= 0.05 && !playedSFX['hit1']) { playedSFX['hit1'] = true; playSfxImpact(); }
      if (t >= 3.35 && !playedSFX['whoosh1']) { playedSFX['whoosh1'] = true; playSfxWhoosh(); }
      if (t >= 7.68 && !playedSFX['whoosh2']) { playedSFX['whoosh2'] = true; playSfxWhoosh(); }
      if (t >= 12.5 && !playedSFX['outro_hit']) { playedSFX['outro_hit'] = true; playSfxWhoosh(); }
    }

    // ─── EASING MATH ──────────────────────────────────────────────────────
    function easeOutBack(x, s = 1.70158) {
      return 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
    }
    function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }

    let shakeStrength = 0;
    function triggerShake(val) { shakeStrength = Math.max(shakeStrength, val); }

    // ─── RENDER ENGINE (CANVAS 1080 x 1920) ───────────────────────────────
    function render(t) {
      ctx.save();
      ctx.clearRect(0, 0, W, H);

      // Camera Shake
      if (shakeStrength > 0.1) {
        const sx = (Math.random() - 0.5) * shakeStrength;
        const sy = (Math.random() - 0.5) * shakeStrength;
        ctx.translate(sx, sy);
        shakeStrength *= 0.88;
      }

      // ─── NỀN DARK CYBER STUDIO ───
      const bgGrad = ctx.createRadialGradient(W * 0.5, H * 0.45, 50, W * 0.5, H * 0.5, 1100);
      bgGrad.addColorStop(0, '#0f172a');
      bgGrad.addColorStop(0.5, '#070a14');
      bgGrad.addColorStop(1, '#020205');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, W, H);

      // Quả cầu ánh sáng Plasma tím - cam mờ ảo
      const orbX = W * 0.5 + Math.sin(t * 1.5) * 120;
      const orbY = 700 + Math.cos(t * 1.2) * 80;
      const orbGrad = ctx.createRadialGradient(orbX, orbY, 10, orbX, orbY, 500);
      orbGrad.addColorStop(0, 'rgba(249, 115, 22, 0.2)');
      orbGrad.addColorStop(0.6, 'rgba(56, 189, 248, 0.06)');
      orbGrad.addColorStop(1, 'transparent');
      ctx.fillStyle = orbGrad;
      ctx.fillRect(0, 0, W, H);

      // ═════════════════════════════════════════════════════════════════════
      // SCENE 1: HOOK NỖI ĐAU (0.0s - 3.35s)
      // Voice: "Bạn vẫn quay màn hình rồi mất hàng giờ zoom thủ công ư?"
      // ═════════════════════════════════════════════════════════════════════
      if (t < 3.35) {
        if (t < 0.1) triggerShake(18);

        const hookProg = Math.min(1, t / 0.35);
        const hookScale = easeOutBack(hookProg, 2.0);

        ctx.save();
        ctx.translate(W * 0.5, 260);
        ctx.scale(hookScale, hookScale);
        drawPillBadge("⚠️ NỖI ÁM ẢNH CỦA CREATOR", 0, 0, '#ef4444');
        ctx.restore();

        // Tiêu đề Tiếng Việt nét căng, không lỗi font
        ctx.textAlign = 'center';
        ctx.fillStyle = '#ffffff';
        ctx.font = `900 82px ${FONT_FAMILY}`;
        ctx.fillText("MỆT MỎI VÌ", W * 0.5, 410);

        const gradRed = ctx.createLinearGradient(150, 0, 930, 0);
        gradRed.addColorStop(0, '#ef4444');
        gradRed.addColorStop(1, '#f97316');
        ctx.fillStyle = gradRed;
        ctx.font = `900 94px ${FONT_FAMILY}`;
        ctx.fillText("ZOOM THỦ CÔNG?", W * 0.5, 520);

        // Minh họa màn hình lỗi thời & keyframe rối mắt
        const boxX = 90, boxY = 600, boxW = 900, boxH = 580;
        drawSquircle(ctx, boxX, boxY, boxW, boxH, 28, 'rgba(20, 20, 30, 0.95)', 'rgba(239, 68, 68, 0.35)');

        ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
        ctx.fillRect(boxX + 40, boxY + 440, boxW - 80, 80);
        ctx.fillStyle = '#ef4444';
        for (let i = 0; i < 18; i++) {
          ctx.beginPath();
          ctx.arc(boxX + 70 + i * 44, boxY + 480, 9, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.fillStyle = '#94a3b8';
        ctx.font = `700 32px ${FONT_FAMILY}`;
        ctx.fillText("Hàng trăm Keyframe thủ công mỗi ngày...", W * 0.5, boxY + 380);

        // DẤU X ĐỎ KHỔNG LỒ GIÁNG XUỐNG
        if (t >= 0.8) {
          const xProg = Math.min(1, (t - 0.8) / 0.25);
          if (xProg < 0.2) triggerShake(25);
          const xScale = easeOutBack(xProg, 2.8);

          ctx.save();
          ctx.translate(W * 0.5, boxY + 200);
          ctx.scale(xScale, xScale);
          ctx.font = `900 240px ${FONT_FAMILY}`;
          ctx.fillStyle = '#ef4444';
          ctx.shadowColor = '#ef4444';
          ctx.shadowBlur = 60;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText("❌", 0, 0);
          ctx.restore();
        }

        drawPillBadge("⏳ Mất 3 - 4 Tiếng Chỉ Để Edit Zoom", W * 0.5, 1270, '#f87171');
      }

      // ═════════════════════════════════════════════════════════════════════
      // SCENE 2: SHOWCASE MACBOOK 3D & DEMO THẬT OK.MP4 (3.35s - 7.68s)
      // Voice: "Record Auto Zoom tự động bắt nét con trỏ chuột và zoom mượt như điện ảnh!"
      // ═════════════════════════════════════════════════════════════════════
      else if (t >= 3.35 && t < 7.68) {
        const localT = t - 3.35;

        // Flash transition chớp trắng
        if (localT < 0.2) {
          ctx.fillStyle = `rgba(255,255,255, ${ (1 - localT / 0.2) * 0.35 })`;
          ctx.fillRect(0, 0, W, H);
        }

        const hProg = Math.min(1, localT / 0.35);
        ctx.save();
        ctx.translate(W * 0.5, 210);
        ctx.scale(easeOutBack(hProg, 2.0), easeOutBack(hProg, 2.0));
        drawPillBadge("🚀 GIẢI PHÁP ĐỘT PHÁ SỐ 1", 0, 0, '#38bdf8');
        ctx.restore();

        ctx.textAlign = 'center';
        ctx.fillStyle = '#ffffff';
        ctx.font = `900 78px ${FONT_FAMILY}`;
        ctx.fillText("RECORD-AUTOZOOM", W * 0.5, 330);

        const gradTech = ctx.createLinearGradient(160, 0, 920, 0);
        gradTech.addColorStop(0, '#f97316');
        gradTech.addColorStop(1, '#facc15');
        ctx.fillStyle = gradTech;
        ctx.font = `800 38px ${FONT_FAMILY}`;
        ctx.fillText("TỰ ĐỘNG BẮT NÉT & PHÓNG TO THEO CHUỘT", W * 0.5, 400);

        // MacBook Pro 3D Space Black với video thật
        const mbT = Math.min(1, localT / 0.45);
        const mbScale = easeOutBack(mbT, 1.6);
        const cameraDive = 1.0 + Math.min(0.18, localT * 0.04);

        ctx.save();
        ctx.translate(W * 0.5, 780);
        ctx.scale(mbScale * cameraDive, mbScale * cameraDive);
        ctx.translate(-W * 0.5, -780);

        drawMacBookProMockup(ctx, 45, 460, 990, 640);
        ctx.restore();

        // Các Floating Badge nổi lên
        if (localT >= 1.2) {
          const b1 = Math.min(1, (localT - 1.2) / 0.3);
          ctx.save();
          ctx.translate(280, 1180);
          ctx.scale(easeOutBack(b1, 2.2), easeOutBack(b1, 2.2));
          drawFloatingChip("✨ 60 FPS ULTRA SMOOTH", 0, 0, '#10b981');
          ctx.restore();
        }

        if (localT >= 2.0) {
          const b2 = Math.min(1, (localT - 2.0) / 0.3);
          ctx.save();
          ctx.translate(800, 1180);
          ctx.scale(easeOutBack(b2, 2.2), easeOutBack(b2, 2.2));
          drawFloatingChip("🎯 ZERO KEYFRAME", 0, 0, '#f59e0b');
          ctx.restore();
        }

        drawPillBadge("🔴 LIVE FOOTAGE • QUAY THỰC TẾ 100%", W * 0.5, 1270, '#facc15');
      }

      // ═════════════════════════════════════════════════════════════════════
      // SCENE 3: TÍNH NĂNG ĐẲNG CẤP (7.68s - 12.0s)
      // Voice: "Tự động hoàn toàn 100%, khung hình 60 FPS siêu mượt trên cả Mac và Windows!"
      // ═════════════════════════════════════════════════════════════════════
      else if (t >= 7.68 && t < 12.0) {
        const localT = t - 7.68;

        ctx.save();
        drawPillBadge("💎 ĐẲNG CẤP DÀNH CHO CREATOR", W * 0.5, 220, '#a855f7');

        ctx.textAlign = 'center';
        ctx.fillStyle = '#ffffff';
        ctx.font = `900 80px ${FONT_FAMILY}`;
        ctx.fillText("TỰ ĐỘNG 100%", W * 0.5, 340);

        ctx.fillStyle = '#38bdf8';
        ctx.font = `800 40px ${FONT_FAMILY}`;
        ctx.fillText("TIẾT KIỆM 90% THỜI GIAN EDIT VIDEO", W * 0.5, 415);

        // 4 Thẻ kim loại cao cấp
        const featureCards = [
          { icon: "⚡", title: "Auto-Focus Con Trỏ Chuột", desc: "Tự nhận diện vùng click & phóng to mượt mà", delay: 0 },
          { icon: "💎", title: "Bo Góc Glassmorphism", desc: "Đổ bóng đa tầng phong cách Apple sang trọng", delay: 0.18 },
          { icon: "🚀", title: "Xuất Video 4K 60 FPS", desc: "Tận dụng GPU máy tính xuất nhanh gấp 5 lần", delay: 0.36 },
          { icon: "🍏", title: "Sẵn Sàng Cho macOS & Win", desc: "Bản cài riêng cho Apple Silicon M & Windows 11", delay: 0.54 }
        ];

        featureCards.forEach((c, idx) => {
          const cardT = Math.max(0, localT - c.delay);
          const prog = Math.min(1, cardT / 0.35);

          if (prog > 0) {
            const scale = easeOutBack(prog, 2.0);
            const cardY = 500 + idx * 200;
            const cardX = W * 0.5;

            ctx.save();
            ctx.translate(cardX, cardY + 85);
            ctx.scale(scale, scale);
            ctx.translate(-cardX, -(cardY + 85));

            drawSquircle(ctx, 80, cardY, 920, 170, 26, 'rgba(255, 255, 255, 0.06)', 'rgba(56, 189, 248, 0.35)');

            // Shimmer light effect
            const shimX = 80 + (localT * 400) % 1100;
            const shimGrad = ctx.createLinearGradient(shimX - 100, 0, shimX + 100, 0);
            shimGrad.addColorStop(0, 'transparent');
            shimGrad.addColorStop(0.5, 'rgba(255, 255, 255, 0.08)');
            shimGrad.addColorStop(1, 'transparent');
            ctx.fillStyle = shimGrad;
            ctx.fillRect(80, cardY, 920, 170);

            // Icon
            ctx.fillStyle = 'rgba(249, 115, 22, 0.25)';
            ctx.beginPath();
            ctx.arc(175, cardY + 85, 52, 0, Math.PI * 2);
            ctx.fill();
            ctx.font = `50px ${FONT_FAMILY}`;
            ctx.textAlign = 'center';
            ctx.fillText(c.icon, 175, cardY + 103);

            // Title & Desc
            ctx.textAlign = 'left';
            ctx.fillStyle = '#ffffff';
            ctx.font = `800 38px ${FONT_FAMILY}`;
            ctx.fillText(c.title, 260, cardY + 74);

            ctx.fillStyle = '#94a3b8';
            ctx.font = `600 27px ${FONT_FAMILY}`;
            ctx.fillText(c.desc, 260, cardY + 122);

            ctx.restore();
          }
        });

        ctx.restore();
      }

      // ═════════════════════════════════════════════════════════════════════
      // SCENE 4: OUTRO SANG TRỌNG • MINIMALIST APPLE (12.0s - 13.8s)
      // TUYỆT ĐỐI KHÔNG CÓ QUẢNG CÁO, KHÔNG KÊU GỌI TẢI, KHÔNG LINK WEB!
      // ═════════════════════════════════════════════════════════════════════
      else {
        const localT = t - 12.0;
        ctx.save();

        // Vòng sáng mờ ảo tinh tế
        const outroGlow = ctx.createRadialGradient(W * 0.5, 780, 50, W * 0.5, 780, 600);
        outroGlow.addColorStop(0, 'rgba(249, 115, 22, 0.2)');
        outroGlow.addColorStop(0.6, 'rgba(56, 189, 248, 0.06)');
        outroGlow.addColorStop(1, 'transparent');
        ctx.fillStyle = outroGlow;
        ctx.fillRect(0, 0, W, H);

        // Logo thương hiệu tinh xảo
        const logoProg = Math.min(1, localT / 0.5);
        const logoScale = easeOutBack(logoProg, 2.0);

        ctx.save();
        ctx.translate(W * 0.5, 720);
        ctx.scale(logoScale, logoScale);

        if (logoImg.complete) {
          ctx.shadowColor = 'rgba(249, 115, 22, 0.6)';
          ctx.shadowBlur = 60;
          ctx.drawImage(logoImg, -140, -140, 280, 280);
        }
        ctx.restore();

        // Tên sản phẩm chính
        ctx.textAlign = 'center';
        ctx.fillStyle = '#ffffff';
        ctx.font = `900 84px ${FONT_FAMILY}`;
        ctx.fillText("Record-AutoZoom", W * 0.5, 1020);

        // Slogan tinh tế
        const gradSlogan = ctx.createLinearGradient(200, 0, 880, 0);
        gradSlogan.addColorStop(0, '#f97316');
        gradSlogan.addColorStop(1, '#38bdf8');
        ctx.fillStyle = gradSlogan;
        ctx.font = `800 44px ${FONT_FAMILY}`;
        ctx.fillText("Tự Động Bắt Nét Chuột • 60 FPS", W * 0.5, 1100);

        // Tag nền tảng cao cấp
        drawPillBadge("🍏 macOS & 🪟 Windows", W * 0.5, 1220, '#10b981');

        ctx.restore();
      }

      // ═════════════════════════════════════════════════════════════════════
      // KINETIC SUBTITLES (CHUẨN FONT BE VIETNAM PRO)
      // ═════════════════════════════════════════════════════════════════════
      drawKineticSubtitles(ctx, t);

      // THANH TIẾN TRÌNH REELS / TIKTOK DƯỚI ĐÁY
      const pWidth = (t / TOTAL_DURATION) * W;
      ctx.fillStyle = '#f97316';
      ctx.fillRect(0, H - 16, pWidth, 16);

      ctx.restore();
    }

    // ─── VẼ MOCKUP MACBOOK PRO 3D SPACE BLACK ─────────────────────────────
    function drawMacBookProMockup(ctx, x, y, w, h) {
      ctx.save();
      ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
      ctx.shadowBlur = 50;
      ctx.shadowOffsetY = 25;

      const r = 26;
      drawSquircle(ctx, x, y, w, h - 35, r, '#1e2029', 'rgba(255,255,255,0.18)');
      ctx.restore();

      ctx.strokeStyle = 'rgba(255,255,255,0.1)';
      ctx.lineWidth = 2;
      drawSquircle(ctx, x + 1, y + 1, w - 2, h - 37, r);
      ctx.stroke();

      const screenMargin = 16;
      const scrX = x + screenMargin;
      const scrY = y + screenMargin + 8;
      const scrW = w - screenMargin * 2;
      const scrH = h - 35 - screenMargin * 2 - 8;

      ctx.save();
      ctx.beginPath();
      ctx.rect(scrX, scrY, scrW, scrH);
      ctx.clip();

      if (demoVideo.readyState >= 2) {
        ctx.drawImage(demoVideo, scrX, scrY, scrW, scrH);
      } else {
        ctx.fillStyle = '#090d16';
        ctx.fillRect(scrX, scrY, scrW, scrH);
        ctx.fillStyle = '#38bdf8';
        ctx.font = `800 32px ${FONT_FAMILY}`;
        ctx.textAlign = 'center';
        ctx.fillText("Đang đồng bộ video thực tế...", scrX + scrW * 0.5, scrY + scrH * 0.5);
      }

      ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
      ctx.fillRect(scrX, scrY, scrW, 26);
      ctx.fillStyle = '#cbd5e1';
      ctx.font = `600 13px ${FONT_FAMILY}`;
      ctx.textAlign = 'left';
      ctx.fillText("🍎 File  Edit  View  Window  Help", scrX + 16, scrY + 18);
      ctx.restore();

      ctx.fillStyle = '#1e2029';
      ctx.beginPath();
      ctx.arc(x + w * 0.5, y + 14, 5, 0, Math.PI * 2);
      ctx.fill();

      // Đế bàn phím nhôm
      const baseH = 32;
      const baseY = y + h - 35;
      const baseW = w + 40;
      const baseX = x - 20;

      ctx.save();
      ctx.fillStyle = '#2d313d';
      ctx.beginPath();
      ctx.moveTo(baseX + 24, baseY);
      ctx.lineTo(baseX + baseW - 24, baseY);
      ctx.quadraticCurveTo(baseX + baseW, baseY + baseH, baseX + baseW - 35, baseY + baseH);
      ctx.lineTo(baseX + 35, baseY + baseH);
      ctx.quadraticCurveTo(baseX, baseY + baseH, baseX + 24, baseY);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#181a20';
      ctx.beginPath();
      ctx.roundRect(x + w * 0.5 - 60, baseY, 120, 9, [0, 0, 6, 6]);
      ctx.fill();
      ctx.restore();
    }

    // ─── VẼ PHỤ ĐỀ KINETIC SUBTITLES (CHUẨN FONT TIẾNG VIỆT) ──────────────
    function drawKineticSubtitles(ctx, t) {
      const activeCue = subtitles.find(s => t >= s.start && t < s.end);
      if (!activeCue) return;

      ctx.save();
      const subBgW = 960;
      const subBgH = 125;
      const subBgX = (W - subBgW) / 2;
      const subBgY = 1660;

      drawSquircle(ctx, subBgX, subBgY, subBgW, subBgH, 24, 'rgba(0, 0, 0, 0.72)', 'rgba(255, 255, 255, 0.12)');

      ctx.font = `900 40px ${FONT_FAMILY}`;
      ctx.textAlign = 'left';

      let fullWords = activeCue.words;
      const lineWords = fullWords.map(w => w.text).join(' ');
      const currentWordIdx = fullWords.findIndex(w => t >= w.start && t < w.end);

      const fullWidth = ctx.measureText(lineWords).width;
      let startX = Math.max(subBgX + 30, (W - fullWidth) / 2);

      fullWords.forEach((wordObj, i) => {
        const isCurrent = (i === currentWordIdx);
        const hasPassed = (t >= wordObj.end);

        ctx.save();
        if (isCurrent) {
          const scale = 1.15;
          ctx.translate(startX + 25, subBgY + 75);
          ctx.scale(scale, scale);
          ctx.translate(-(startX + 25), -(subBgY + 75));

          ctx.fillStyle = wordObj.highlight || '#facc15';
          ctx.shadowColor = wordObj.highlight || '#facc15';
          ctx.shadowBlur = 24;
        } else if (hasPassed) {
          ctx.fillStyle = '#ffffff';
          ctx.shadowBlur = 0;
        } else {
          ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
          ctx.shadowBlur = 0;
        }

        ctx.font = `900 40px ${FONT_FAMILY}`;
        ctx.fillText(wordObj.text, startX, subBgY + 76);
        ctx.restore();

        startX += ctx.measureText(wordObj.text + " ").width;
      });

      ctx.restore();
    }

    // ─── UTILS VẼ ─────────────────────────────────────────────────────────
    function drawPillBadge(text, x, y, color) {
      ctx.save();
      ctx.font = `800 28px ${FONT_FAMILY}`;
      ctx.textAlign = 'center';
      const textW = ctx.measureText(text).width;
      const bW = textW + 60;
      const bH = 64;
      const bX = x - bW / 2;
      const bY = y - bH / 2;

      ctx.fillStyle = 'rgba(10, 10, 18, 0.75)';
      ctx.strokeStyle = color;
      ctx.lineWidth = 3;
      drawSquircle(ctx, bX, bY, bW, bH, 20);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = color;
      ctx.fillText(text, x, y + 10);
      ctx.restore();
    }

    function drawFloatingChip(text, x, y, color) {
      ctx.save();
      ctx.font = `800 26px ${FONT_FAMILY}`;
      ctx.textAlign = 'center';
      const textW = ctx.measureText(text).width;
      const bW = textW + 48;
      const bH = 58;
      drawSquircle(ctx, x - bW/2, y - bH/2, bW, bH, 18, 'rgba(0,0,0,0.85)', color);
      ctx.fillStyle = color;
      ctx.fillText(text, x, y + 9);
      ctx.restore();
    }

    function drawSquircle(ctx, x, y, w, h, r, fill, stroke) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();

      if (fill) {
        ctx.fillStyle = fill;
        ctx.fill();
      }
      if (stroke) {
        ctx.strokeStyle = stroke;
        ctx.lineWidth = 3;
        ctx.stroke();
      }
    }

    // ─── ĐỒNG BỘ MEDIA ────────────────────────────────────────────────────
    function syncMedia(t, playing) {
      if (playing) {
        if (voiceAudio.paused && t < TOTAL_DURATION) {
          voiceAudio.currentTime = t;
          voiceAudio.play().catch(() => {});
        } else if (Math.abs(voiceAudio.currentTime - t) > 0.25) {
          voiceAudio.currentTime = t;
        }
      } else {
        if (!voiceAudio.paused) voiceAudio.pause();
      }

      if (t >= 3.35 && t < 7.68) {
        const targetVideoTime = t - 3.35;
        if (playing) {
          if (demoVideo.paused) {
            demoVideo.play().catch(() => {});
          }
          if (Math.abs(demoVideo.currentTime - targetVideoTime) > 0.25) {
            demoVideo.currentTime = targetVideoTime;
          }
        } else {
          if (!demoVideo.paused) demoVideo.pause();
        }
      } else {
        if (!demoVideo.paused) demoVideo.pause();
        if (t < 3.35 && demoVideo.currentTime !== 0) demoVideo.currentTime = 0;
      }
    }

    // ─── ANIMATION LOOP ───────────────────────────────────────────────────
    function loop(timestamp) {
      if (!lastTimestamp) lastTimestamp = timestamp;
      const delta = (timestamp - lastTimestamp) / 1000;
      lastTimestamp = timestamp;

      if (isPlaying) {
        currentTime += delta;
        checkSFX(currentTime);
        if (currentTime >= TOTAL_DURATION) {
          currentTime = TOTAL_DURATION;
          isPlaying = false;
          if (!demoVideo.paused) demoVideo.pause();
          if (!voiceAudio.paused) voiceAudio.pause();
          updatePlayUI();
        }
      }

      syncMedia(currentTime, isPlaying);
      render(currentTime);
      updateTimeDisplay();

      if (isPlaying || currentTime < TOTAL_DURATION) {
        requestAnimationFrame(loop);
      }
    }

    function togglePlay() {
      initAudioEngine();
      isPlaying = !isPlaying;
      if (isPlaying && currentTime >= TOTAL_DURATION) {
        currentTime = 0;
        demoVideo.currentTime = 0;
        voiceAudio.currentTime = 0;
        playedSFX = {};
      }
      lastTimestamp = performance.now();
      updatePlayUI();
      if (isPlaying) requestAnimationFrame(loop);
    }

    function restartVideo() {
      initAudioEngine();
      currentTime = 0;
      demoVideo.currentTime = 0;
      voiceAudio.currentTime = 0;
      playedSFX = {};
      isPlaying = true;
      lastTimestamp = performance.now();
      updatePlayUI();
      requestAnimationFrame(loop);
    }

    function updatePlayUI() {
      document.getElementById('playIcon').textContent = isPlaying ? '⏸' : '▶';
      document.getElementById('playText').textContent = isPlaying ? 'Tạm dừng' : 'Phát Video (Có Voice AI + Beat)';
    }

    function updateTimeDisplay() {
      const curSec = Math.floor(currentTime).toString().padStart(2, '0');
      const totSec = Math.floor(TOTAL_DURATION).toString().padStart(2, '0');
      document.getElementById('timeDisplay').textContent = `00:${curSec} / 00:${totSec}`;
    }

    // ─── XUẤT VIDEO 60 FPS HOÀN CHỈNH ─────────────────────────────────────
    function recordAndExport() {
      initAudioEngine();

      const canvasStream = canvas.captureStream(60);
      const audioTracks = audioDest ? audioDest.stream.getAudioTracks() : [];
      const combinedStream = new MediaStream([
        ...canvasStream.getVideoTracks(),
        ...audioTracks
      ]);

      let mimeType = 'video/webm;codecs=vp9,opus';
      if (!MediaRecorder.isTypeSupported(mimeType)) {
        mimeType = 'video/webm';
      }

      const recorder = new MediaRecorder(combinedStream, {
        mimeType: mimeType,
        videoBitsPerSecond: 16000000,
        audioBitsPerSecond: 256000
      });

      const chunks = [];
      recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: mimeType });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'Record-AutoZoom-Showcase-60FPS.webm';
        a.click();
        URL.revokeObjectURL(url);
        alert('🎉 ĐÃ XUẤT VIDEO THÀNH CÔNG!\nTệp "Record-AutoZoom-Showcase-60FPS.webm" (1080x1920 60 FPS + Voice AI) đã tải về máy!');
        document.getElementById('btnRecord').innerHTML = '<span>⚡</span> <span>Xuất File 60 FPS (Đủ Hình & Tiếng)</span>';
      };

      currentTime = 0;
      demoVideo.currentTime = 0;
      voiceAudio.currentTime = 0;
      playedSFX = {};
      isPlaying = true;
      lastTimestamp = performance.now();
      recorder.start();
      document.getElementById('btnRecord').innerHTML = '<span>🔴</span> <span>Đang xuất cả hình & tiếng...</span>';

      const recordInterval = setInterval(() => {
        if (!isPlaying || currentTime >= TOTAL_DURATION) {
          clearInterval(recordInterval);
          recorder.stop();
          isPlaying = false;
          if (!demoVideo.paused) demoVideo.pause();
          if (!voiceAudio.paused) voiceAudio.pause();
          updatePlayUI();
        }
      }, 200);

      requestAnimationFrame(loop);
    }

    // Đảm bảo font chữ Be Vietnam Pro load xong 100% trước khi render frame đầu
    document.fonts.ready.then(() => {
      render(0);
    });
    logoImg.onload = () => render(0);
    render(0);
  </script>
