<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Recordly Screen Recorder</title>
	<style>
		:root {
			--bg: #111215;
			--card: #18191d;
			--border: #282a30;
			--text: #f3f4f6;
			--text-muted: #9ca3af;
			--red: #ef4444;
			--red-hover: #dc2626;
		}

		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			user-select: none;
		}

		body {
			background-color: var(--bg);
			color: var(--text);
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 20px;
		}

		.recorder-card {
			background: var(--card);
			border: 1px solid var(--border);
			border-radius: 16px;
			padding: 28px;
			width: 100%;
			max-width: 420px;
			text-align: center;
			box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 18px;
		}

		.brand {
			display: flex;
			align-items: center;
			gap: 10px;
		}

		.brand-logo {
			width: 32px;
			height: 32px;
			border-radius: 8px;
		}

		.brand-title {
			font-size: 18px;
			font-weight: 700;
			color: #fff;
		}

		.status-badge {
			display: inline-flex;
			align-items: center;
			gap: 6px;
			padding: 6px 14px;
			background: rgba(239, 68, 68, 0.15);
			border: 1px solid rgba(239, 68, 68, 0.3);
			border-radius: 20px;
			font-size: 13px;
			font-weight: 600;
			color: #f87171;
		}

		.pulse-dot {
			width: 8px;
			height: 8px;
			background: var(--red);
			border-radius: 50%;
			animation: pulse 1.2s infinite ease-in-out;
		}

		@keyframes pulse {
			0% { transform: scale(0.9); opacity: 0.7; }
			50% { transform: scale(1.4); opacity: 1; }
			100% { transform: scale(0.9); opacity: 0.7; }
		}

		.timer-display {
			font-size: 42px;
			font-weight: 800;
			letter-spacing: 2px;
			color: #ffffff;
			font-variant-numeric: tabular-nums;
		}

		.hint-text {
			font-size: 12px;
			color: var(--text-muted);
			line-height: 1.4;
		}

		.actions {
			display: flex;
			gap: 10px;
			width: 100%;
			margin-top: 6px;
		}

		.btn {
			flex: 1;
			padding: 12px 16px;
			border-radius: 10px;
			font-size: 14px;
			font-weight: 600;
			border: none;
			cursor: pointer;
			transition: all 0.2s ease;
		}

		.btn-stop {
			background: linear-gradient(135deg, #ef4444, #dc2626);
			color: white;
			box-shadow: 0 4px 14px rgba(239, 68, 68, 0.4);
		}

		.btn-stop:hover {
			background: linear-gradient(135deg, #f87171, #ef4444);
			transform: translateY(-1px);
		}

		.btn-cancel {
			background: #2a2c33;
			color: var(--text-muted);
			border: 1px solid var(--border);
		}

		.btn-cancel:hover {
			color: white;
			background: #373942;
		}
	</style>
</head>
<body>
	<div class="recorder-card">
		<div class="brand">
			<img src="icons/recordly-32.png" alt="Recordly" class="brand-logo" />
			<span class="brand-title">Recordly Recorder</span>
		</div>

		<div class="status-badge" id="status-badge">
			<span class="pulse-dot"></span>
			<span id="status-text">Recording Screen</span>
		</div>

		<div class="timer-display" id="timer-display">00:00</div>

		<p class="hint-text" id="hint-text">
			You are recording. When finished, click <strong>Stop & Edit</strong> or use Chrome's blue Stop sharing bar at the bottom.
		</p>

		<div class="actions">
			<button class="btn btn-stop" id="btn-stop">Stop & Edit Video</button>
			<button class="btn btn-cancel" id="btn-cancel">Cancel</button>
		</div>
	</div>

	<script src="recorder.js"></script>
</body>
</html>
